<script>
  const qr = qrcode(0, 'M');
  qr.addData('https://johnnyfan-cuhk.github.io/basketball-stats-agent/');
  qr.make();
  const n = qr.getModuleCount();
  const s = 2;
  const svg = document.querySelector('svg');
  const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  const bg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  bg.setAttribute('x', 596); bg.setAttribute('y', 914);
  bg.setAttribute('width', n * s + 10); bg.setAttribute('height', n * s + 10);
  bg.setAttribute('rx', 5); bg.setAttribute('fill', '#ffffff');
  g.appendChild(bg);
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
    if (!qr.isDark(r, c)) continue;
    const dot = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    dot.setAttribute('x', 596 + 5 + c * s); dot.setAttribute('y', 914 + 5 + r * s);
    dot.setAttribute('width', s); dot.setAttribute('height', s); dot.setAttribute('fill', '#0e0a1a');
    g.appendChild(dot);
  }
  svg.appendChild(g);
</script>
